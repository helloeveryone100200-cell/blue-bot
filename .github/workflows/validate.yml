name: Validate Blue Bot

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - redesign/premium-dark-safe-ui

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot source
        run: python -m py_compile bot.py
      - name: Run static regression tests
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript syntax
        run: node --check admin/app.js
