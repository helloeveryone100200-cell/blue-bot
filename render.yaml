services:
  - type: web
    name: blue-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: ADMIN_GROUP_ID
        value: "-1001234567890"
      - key: PORT
        value: "8080"
